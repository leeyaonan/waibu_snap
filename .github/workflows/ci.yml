name: 双端工程检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / Qt 6.11.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt-arch: clang_64
          - os: windows-latest
            qt-arch: win64_msvc2022_64
    steps:
      - name: 获取源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 准备 CI 工具所需 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装精确版本 Qt（仅 qtbase）
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.2'
          arch: ${{ matrix.qt-arch }}
          archives: qtbase
          setup-python: false
          aqtversion: '==3.3.0'
          cache: true
      - name: 安装固定版本格式工具
        run: python -m pip install clang-format==18.1.8
      - name: macOS 环境、构建、测试、格式检查
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/build-project.sh
          bash scripts/test-project.sh
          bash scripts/lint-code.sh
          file build/macos/bin/WaibuSnap.app/Contents/MacOS/WaibuSnap
          otool -L build/macos/bin/WaibuSnap.app/Contents/MacOS/WaibuSnap
      - name: Windows 环境、构建、测试、格式检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-project.ps1
          ./scripts/test-project.ps1
          ./scripts/lint-code.ps1
      - name: 输出失败诊断
        if: failure()
        shell: bash
        run: |
          find build -name LastTest.log -type f -exec cat {} \;
