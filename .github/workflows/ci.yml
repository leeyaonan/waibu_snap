name: 双端工程检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / Qt 6.11.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt-arch: clang_64
          - os: windows-latest
            qt-arch: win64_msvc2022_64
    steps:
      - name: 获取源码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: 准备 CI 工具所需 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: 安装精确版本 Qt（仅 qtbase）
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.2'
          arch: ${{ matrix.qt-arch }}
          archives: qtbase
          setup-python: false
          # 3.3.0 尚未包含 Windows Qt 6.11 仓库布局修复（上游 PR #1000）。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          py7zrversion: '==1.1.0'
          cache: true
      - name: 安装固定版本格式工具
        run: python -m pip install clang-format==18.1.8
      - name: macOS 环境、构建、测试、格式检查
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/build-project.sh
          bash scripts/test-project.sh
          bash scripts/lint-code.sh
          file build/macos/bin/WaibuSnap.app/Contents/MacOS/WaibuSnap
          otool -L build/macos/bin/WaibuSnap.app/Contents/MacOS/WaibuSnap
      - name: macOS Intel 交叉构建（不替代实机运行）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          MACOS_ARCHITECTURES=x86_64 WAIBUSNAP_BUILD_DIR="$PWD/build/macos-x86_64" bash scripts/build-project.sh
          file build/macos-x86_64/bin/WaibuSnap.app/Contents/MacOS/WaibuSnap
      - name: Windows 环境、构建、测试、格式检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-project.ps1
          ./scripts/test-project.ps1
          ./scripts/lint-code.ps1
      - name: 输出失败诊断
        if: failure()
        shell: bash
        run: |
          if [[ -d build ]]; then
            find build -name LastTest.log -type f -exec cat {} \;
            find build -name '*-output.txt' -type f -exec cat {} \;
          fi
